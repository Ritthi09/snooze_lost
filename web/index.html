<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="snooze_lost">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>snooze_lost</title>
  <link rel="manifest" href="manifest.json">

  <!-- 🟢 ปรับ CSS ตกแต่งวิดีโอให้ภาพสว่าง คมชัด และลด Noise ทางสายตา -->
  <style>
    video {
      filter: contrast(108%) brightness(110%) saturate(105%);
      object-fit: cover;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- โหลด ไลบรารีสำหรับประมวลผล TFLite บน Web -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite/dist/tf-tflite.min.js"></script>
  
  <script src="audio_alert.js"></script>
  
  <!-- สคริปต์โหลดและประมวลผลโมเดล TFLite -->
  <script>
    let tfliteModel = null;

    // ตั้งค่า WASM Path สำหรับ TFLite
    tflite.setWasmPath('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite/dist/');

    // 1. โหลดโมเดลจาก assets
    async function loadTfliteModel() {
  try {
    tfliteModel = await tflite.loadTFLiteModel('model/best_float16.tflite');
    console.log("✅ TFLite Model Loaded Successfully!");
    
    // พิมพ์ตรวจสอบ Output Shape ของ โมเดลใน Browser Console
    if (tfliteModel.outputShape) {
      console.log("📐 Model Output Shape:", tfliteModel.outputShape);
    }
  } catch (error) {
    console.error("❌ Failed to load TFLite Model:", error);
  }
}

    // 🟢 2. ฟังก์ชันปรับแต่งกล้อง (แก้ Noise + ย้อนแสง + เร่งความชัด HD)
    async function enhanceCameraStream(videoElement) {
      if (!videoElement || !videoElement.srcObject) return;
      
      const stream = videoElement.srcObject;
      const tracks = stream.getVideoTracks();
      
      if (tracks.length > 0) {
        const track = tracks[0];
        
        // ถ้าเคยปรับแต่งแทร็กนี้แล้ว ไม่ต้องปรับซ้ำ
        if (track.dataset && track.dataset.enhanced) return;

        try {
          // บังคับการตั้งค่าความละเอียดและ Auto Exposure
          await track.applyConstraints({
            width: { ideal: 1280 },
            height: { ideal: 720 },
            advanced: [
              { exposureMode: 'continuous' },
              { whiteBalanceMode: 'continuous' },
              { focusMode: 'continuous' }
            ]
          });
          track.dataset = track.dataset || {};
          track.dataset.enhanced = "true";
          console.log("📸 Camera stream enhanced: HD + Auto Exposure enabled.");
        } catch (e) {
          console.warn("⚠️ Camera constraints not fully supported on this browser:", e);
        }
      }
    }

    async function detectVideo(videoElement) {
      if (!tfliteModel) {
        console.warn("Model not ready yet.");
        return null;
      }

      if (!videoElement) {
        videoElement = document.querySelector('video');
      }

      if (!videoElement) return null;

      // 🟢 สั่งปรับคุณภาพกล้องอัตโนมัติเมื่อพบ Element ของวิดีโอ
      enhanceCameraStream(videoElement);

      try {
        return tf.tidy(() => {
          // 1. แปลงภาพจากกล้องเป็น Tensor
          const imgTensor = tf.browser.fromPixels(videoElement);

          // 2. ปรับขนาดภาพเป็น 640x640
          const resized = tf.image.resizeBilinear(imgTensor, [640, 640]);

          // 3. ปรับสเกลภาพเป็น 0.0 - 1.0
          const normalized = tf.div(resized, 255.0);

          // 4. ขยาย Dimension (Batch size = 1)
          const batched = tf.expandDims(normalized, 0);

          // 5. รัน Predict ผ่าน TFLite Model
          const predictions = tfliteModel.predict(batched);
          const data = predictions.dataSync();

          return JSON.stringify(Array.from(data));
        });
      } catch (err) {
        console.error("Error during detection:", err);
        return null;
      }
    }
    
    // เริ่มโหลดโมเดลทันทีเมื่อเปิดเว็บ
    loadTfliteModel();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="snooze_lost">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>snooze_lost</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- โหลด TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

  <!-- สคริปต์โหลดและประมวลผลโมเดล -->
  <script>
    let model;

    // 1. โหลดโมเดล
    async function loadYoloModel() {
      model = await tf.loadGraphModel('model/model.json');
      console.log("TF.js Model Loaded!");
    }

    // 2. ฟังก์ชันรับวิดีโอมาทำ Prediction
    async function detectVideo(videoElement) {
      if (!model) return null;
      
      // แปลงภาพจากวิดีโอกล้องเป็น Tensor และ Resize ให้ตรงกับขนาดที่ YOLO ใช้ (เช่น 640x640)
      const tensor = tf.browser.fromPixels(videoElement)
        .resizeNearestNeighbor([640, 640])
        .toFloat()
        .div(tf.scalar(255.0))
        .expandDims();

      // ประมวลผลผ่านโมเดล
      const predictions = await model.predict(tensor);
      
      // คืนค่าผลลัพธ์กลับไปให้ Dart/Flutter
      return predictions.dataSync(); 
    }

    loadYoloModel();
  </script>
</body>
</html>
